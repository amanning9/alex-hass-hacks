# Development tooling only (tests, HACKS.md generator); not a Python package. The integration's
# version lives in custom_components/alex_hacks/manifest.json.
[project]
name = "alex-hass-hacks"
version = "0"
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
    # Home Assistant test harness; 0.13.373 bundles Home Assistant 2026.10.2, which the tests were written against.
    "pytest-homeassistant-custom-component==0.13.375",
    # The library Home Assistant's Ecovacs integration uses (same version as its manifest), for the Ecovacs hack.
    "deebot-client==18.7.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
