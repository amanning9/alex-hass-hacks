name: Release

# Publishes a GitHub release (which HACS offers as an update) for the version in manifest.json:
# - on every push to main: when that version has no release yet, tag v<version> on that commit
#   and release it (so merging a PR that bumps the version is the whole release);
# - on pushing a v* tag yourself: check it matches the manifest and release it.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Work out the tag
        id: tag
        run: |
          version=$(uv run --no-project python -c "import json;print(json.load(open('custom_components/alex_hacks/manifest.json'))['version'])")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # Either may have a leading "v" (tag v1.2.3, manifest 1.2.3 is the convention).
            test "${version#v}" = "${GITHUB_REF_NAME#v}" || { echo "Tag $GITHUB_REF_NAME doesn't match manifest version $version"; exit 1; }
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${version#v}" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        # Already released (an unchanged version on main, or a release made in the GitHub UI,
        # whose tag runs this too): nothing to do. Otherwise this creates the tag (on this
        # commit) along with the release.
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
