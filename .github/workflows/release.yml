name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Check the tag matches manifest.json
        run: |
          version=$(uv run --no-project python -c "import json;print(json.load(open('custom_components/alex_hacks/manifest.json'))['version'])")
          # Either may have a leading "v" (tag v1.2.3, manifest 1.2.3 is the convention).
          test "${version#v}" = "${GITHUB_REF_NAME#v}" || { echo "Tag $GITHUB_REF_NAME doesn't match manifest version $version"; exit 1; }
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        # Releases made in the GitHub UI create the tag too, which runs this; don't make a second one.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
